<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <script>
      // UI kit step 1d: dark by default. Apply a saved light choice (mode-watcher's key) before the
      // page paints, so there is no dark->light flash; mode-watcher takes over once the app loads.
      // A choice saved under the admin's old key ('hiro.admin.theme') is carried over once.
      try {
        var old = localStorage.getItem('hiro.admin.theme');
        if (old) {
          if (!localStorage.getItem('mode-watcher-mode') && (old === 'light' || old === 'dark')) {
            localStorage.setItem('mode-watcher-mode', old);
          }
          localStorage.removeItem('hiro.admin.theme');
        }
        if (localStorage.getItem('mode-watcher-mode') === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
