# Foundling Memory Stress question bank (100 Qs).
# Pairs with foundling_memory_stress.episodes.jsonl.
# Theme: "Foundling From the Sky" - adoptive family, small-town life, hidden origin,
# secret identity, emerging powers, family rules, and corrections.
# Fictional, dense, and benchmark-shaped: direct recall, preference, hops, temporal,
# knowledge update, local-domain reasoning, misleading entities, and abstention.

