# Adam's-year question bank for the Graphiti pivot eval (category-tagged).
# Pairs with eval/adam_year.episodes.jsonl. 100 questions, balanced across the 12
# §8.4 categories (~8 each). Each row:
#   id, category, (subcategory),
#   question,
#   expected_answer    — human-readable gold answer (documentation/review only; the
#                        scorer does NOT read this — see §"scoring" below),
#   and EITHER expected_fragments (the lowercase substrings the scorer looks for)
#   OR expected_kind: abstain (negative control — declining is the correct outcome).
#   must_not_contain   — superseded-fact / contradiction guard (forces fail on leak).
#   requires           — lens where the graph leg should win (graph | temporal | world);
#                        any of these flips requires_graph=True for the gate subset.
# See docs/knowledge-graphiti-pivot-design.md §8.4–8.6.
#
# NOTE on `expected_answer`: it is an UNSCORED documentation field. The runner's
# load_questions() reads only `expected_fragments` / `expected_kind` /
# `must_not_contain` / `requires`; unknown keys pass through harmless. Scoring is
# case-insensitive substring matching of `expected_fragments` (a deliberate lower
# bound), with abstain as the correct outcome on the `expected_kind: abstain` rows.

