# Hogwarts temporal question bank (10 Qs). Pairs with hogwarts_temporal.episodes.jsonl.
#
# Every question is TEMPORAL by design and NOT answerable by text/vector search: the corpus
# states many same-typed values over time (six DADA teachers, two brooms, two Ministers, two
# pets), so a naive search surfaces all of them and can't pick the right one. Only temporal
# reasoning (latest-wins supersession, valid_at/invalid_at intervals, ordering, point-in-time,
# distinct-count) resolves them — Graphiti's strength.
#
#   expected_fragments  — the temporally-correct answer (lowercase substring match).
#   must_not_contain    — the values a text search would WRONGLY surface (old/other candidates);
#                         their presence = a temporal-leak failure.
#   requires: [temporal] — flips requires_graph=True (the gate subset).
#   expected_answer     — unscored gold, shown beside recalled facts in the recall inspector.

# --- current value (latest-wins supersession) ---
- id: q_current_dada
  category: supersession
  question: "Who currently teaches Defence Against the Dark Arts at Hogwarts?"
  expected_answer: "Severus Snape (the most recent of six teachers)."
  expected_fragments: ["Snape"]
  must_not_contain: ["Quirrell", "Lockhart", "Lupin", "Moody", "Umbridge"]
  requires: [temporal]

- id: q_current_broom
  category: supersession
  question: "Which broomstick does Harry fly now?"
  expected_answer: "A Firebolt — his Nimbus 2000 was destroyed."
  expected_fragments: ["Firebolt"]
  must_not_contain: ["Nimbus 2000"]
  requires: [temporal]

- id: q_current_minister
  category: supersession
  question: "Who is the current Minister for Magic?"
  expected_answer: "Rufus Scrimgeour (he replaced Fudge)."
  expected_fragments: ["Scrimgeour"]
  must_not_contain: ["Fudge"]
  requires: [temporal]

- id: q_current_ron_pet
  category: supersession
  question: "What pet does Ron Weasley keep now?"
  expected_answer: "An owl named Pigwidgeon (his rat Scabbers is gone)."
  expected_fragments: ["Pigwidgeon"]
  must_not_contain: ["Scabbers"]
  requires: [temporal]

# --- invalidation (a fact that ended) ---
- id: q_nimbus_still
  category: invalidation
  question: "Is the Nimbus 2000 still Harry's broom?"
  expected_answer: "No — it was destroyed by the Whomping Willow; he flies a Firebolt now."
  expected_fragments: ["Firebolt"]
  must_not_contain: ["still flies the Nimbus", "yes"]
  requires: [temporal]

# --- point-in-time ("as of" a date / interval) ---
- id: q_dada_1994
  category: point_in_time
  question: "Who was teaching Defence Against the Dark Arts during the 1994–1995 school year?"
  expected_answer: "Alastor 'Mad-Eye' Moody."
  expected_fragments: ["Moody"]
  must_not_contain: ["Snape", "Umbridge", "Lupin"]
  requires: [temporal]

# --- ordering (relative to another fact) ---
- id: q_dada_before_snape
  category: ordering
  question: "Who taught Defence Against the Dark Arts in the year just before Snape took over?"
  expected_answer: "Dolores Umbridge."
  expected_fragments: ["Umbridge"]
  must_not_contain: ["Moody", "Snape"]
  requires: [temporal]

- id: q_minister_before_scrimgeour
  category: ordering
  question: "Who was Minister for Magic immediately before Rufus Scrimgeour?"
  expected_answer: "Cornelius Fudge."
  expected_fragments: ["Fudge"]
  must_not_contain: ["Scrimgeour"]
  requires: [temporal]

# --- first / earliest ---
- id: q_first_dada
  category: ordering
  question: "Who was Harry's very first Defence Against the Dark Arts teacher?"
  expected_answer: "Professor Quirrell."
  expected_fragments: ["Quirrell"]
  must_not_contain: ["Snape", "Umbridge"]
  requires: [temporal]

# --- distinct-count over time ---
- id: q_count_dada
  category: counting
  question: "How many different Defence Against the Dark Arts teachers have there been across these years?"
  expected_answer: "Six — Quirrell, Lockhart, Lupin, Moody, Umbridge, Snape."
  expected_fragments: ["six"]
  must_not_contain: []
  requires: [temporal]
