[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiro-channel-whatsapp"
version = "0.2.0"
description = "WhatsApp channel plugin for Hiro-League (neonize / whatsmeow)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Michel Habib", email = "michelhabib@gmail.com" },
]

keywords = ["home", "server", "channel", "plugin", "whatsapp", "neonize"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12",
    # neonize: Python bindings over the Go `whatsmeow` multi-device library.
    # Provides the async NewAClient used to link/receive/send over WhatsApp Web.
    # PINNED to 0.5.2 (2026-11-06). 0.3.18.post0 was pinned before because the 0.4.x
    # line corrupted media downloads (download_any: right length, wrong bytes) and the
    # send ack ("Wire format corrupt"), and 0.4.0 failed to import. But WhatsApp now
    # refuses 0.3.18's whatsmeow ("Client outdated", 405), so it can't connect at all.
    # 0.5.2 connects today (HomeHiro runs it on the same server) and its aioze API is
    # the one this plugin uses; 0.6.1–0.10.0 came out in a two-day burst (Nov 2–3),
    # too new to trust. wa_client.py logs sha_match on every voice note download, so a
    # return of the media defect shows in the plugin's log.
    "neonize==0.5.2",
    # qrcode: render the pairing QR as ASCII into the plugin log (P1 has no UI yet).
    "qrcode>=7",
    # static-ffmpeg: bundles BOTH ffmpeg and ffprobe (downloaded+cached on first
    # use, no admin) and prepends them to PATH. Outbound voice (P7) needs ffmpeg
    # for the MP3→OGG/Opus transcode AND ffprobe because neonize's
    # build_audio_message shells `ffprobe` to read the clip duration at send time.
    # `add_paths(weak=True)` defers to a system ffmpeg if one is already present,
    # so end users of the WhatsApp plugin get voice with zero manual install.
    "static-ffmpeg>=2.13",
    "hiro-channel-sdk~=0.2.0",
    "hiro-commons~=0.2.0",
]

[project.urls]
Homepage = "https://www.hiroleague.com"
Documentation = "https://docs.hiroleague.com"
Repository = "https://github.com/hiro-league/hiroleague"
Issues = "https://github.com/hiro-league/hiroleague/issues"

[project.scripts]
hiro-channel-whatsapp = "hiro_channel_whatsapp.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hiro_channel_whatsapp"]

[tool.uv.sources]
hiro-channel-sdk = { workspace = true }
hiro-commons = { workspace = true }
