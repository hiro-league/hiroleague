[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hirocli"
version = "0.1.3"
description = "Desktop server CLI for Hiro-League(the `hiro` command)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Michel Habib", email = "michelhabib@gmail.com" },
]

keywords = ["home", "server", "websocket", "gateway", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rich>=13",
    "cryptography>=43",
    "openai>=2.0",
    "google-genai>=1.66",
    "lameenc>=1.8.2",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.8.0",
    "langchain-openai>=0.3",
    "langchain-anthropic>=1.4",
    "langchain-google-genai>=4.2",
    "langchain-deepseek>=1.0",
    "langchain-ollama>=1.0.1",
    "langchain-community>=0.3",
    # Qdrant: vector store for the knowledge passage layer (dense + BM25 hybrid).
    "qdrant-client>=1.18.0",
    # Qdrant sparse vectors for BM25 keyword search (knowledge hybrid retrieval).
    "fastembed>=0.8.0",
    # Local cross-encoder reranker for knowledge retrieval. Pulls torch +
    # huggingface-hub transitively; ~100MB on first install.
    "sentence-transformers>=5.4",
    # Knowledge reranker — cloud providers (catalog) + local FlashRank starter loader.
    # Cohere/Voyage are LangChain BaseDocumentCompressor impls; flashrank is a small ONNX
    # cross-encoder loader (no torch). sentence-transformers (above) covers the bge/gte lanes.
    "langchain-cohere>=0.5.1",
    "langchain-voyageai>=0.3.3",
    "flashrank>=0.2.10",
    "keyring>=25.7",
    "platformdirs>=4",
    "aiosqlite>=0.20",
    "sqlmodel>=0.0.21",
    "qrcode>=8.0",
    "psutil>=7.0",
    "pillow>=12.2",
    "hiro-commons~=0.1.3",
    "hiro-channel-sdk~=0.1.3",
    # hirocli imports hirogateway.service / .instance / .config to drive the
    # `hiro gateway *` lifecycle commands, so hirogate is a real library
    # dependency of hirocli, not just a co-located process. VPS-only deploys
    # are unaffected — those install `hirogate` alone, never `hirocli`.
    "hirogate~=0.1.3",
    "langchain-qdrant>=1.1.0",
    "langdetect>=1.0.9",
    "graphiti-core==0.29.1",
    "kuzu==0.11.3",
]

[project.urls]
Homepage = "https://www.hiroleague.com"
Documentation = "https://docs.hiroleague.com"
Repository = "https://github.com/hiro-league/hiroleague"
Issues = "https://github.com/hiro-league/hiroleague/issues"

[project.scripts]
hiro = "hirocli.commands.app:app"

[tool.uv.sources]
hiro-commons = { workspace = true }
hiro-channel-sdk = { workspace = true }
hirogate = { workspace = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/hirocli"]
artifacts = ["src/hirocli/admin_svelte/static/**"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# Many admin feature tests use the same basename (test_service.py); importlib mode
# gives each file a unique import path and avoids "import file mismatch" on collection.
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
