  # Rerank-only cloud providers (knowledge retrieval precision step). Local in-process
  # rerankers (FlashRank / FastEmbed / sentence-transformers) are NOT here — they live in the
  # services.knowledge local-reranker registry, mirroring the FastEmbed embedder fallback.
  - id: voyage
    display_name: Voyage AI
    hosting: cloud
    credential_env_keys: [VOYAGE_API_KEY]
    docs_url: https://docs.voyageai.com
    recommended_models:
      rerank: voyage:rerank-2.5
    free_offers:
      - label: Free rerank
        summary: 200M processed rerank tokens per account (rerank-2.5 family)
        updated_at: "2026-05-30"
        details: |
          Voyage waives charges for the first 200 million processed rerank tokens per account
          on rerank-2.5 and rerank-2.5-lite. Processed tokens = (query tokens × document count)
          + sum of document tokens. Legacy rerank-2 / rerank-2-lite rows do not include this
          allowance. Verify current limits on the pricing page before production use.
        details_url: https://docs.voyageai.com/docs/pricing
    metadata_updated_at: "2026-05-30"

  - id: cohere
    display_name: Cohere
    hosting: cloud
    credential_env_keys: [COHERE_API_KEY]
    docs_url: https://docs.cohere.com
    recommended_models:
      rerank: cohere:rerank-v4.0-pro
    free_offers:
      - label: Trial API
        summary: "Trial key: 1,000 API calls/mo (all endpoints), Rerank 10 req/min — non-production"
        updated_at: "2026-05-30"
        details: |
          New Cohere accounts get a trial API key (free, non-production). Trial keys share one
          monthly cap of 1,000 API calls across all endpoints — Rerank counts toward that pool,
          not a separate rerank-only quota. Per-endpoint rate limit for Rerank on trial keys is
          10 requests per minute (production keys: 1,000 req/min). Trial usage is for evaluation
          and proof-of-concept only; add billing and use a production key for commercial or
          sustained workloads.
        details_url: https://docs.cohere.com/docs/rate-limits
    metadata_updated_at: "2026-05-30"

  # Image-generation cloud provider (Workers AI REST). Needs TWO credentials: the API token
  # (secret → keyring) and the account id (non-secret, part of the REST URL → providers.json).
  - id: cloudflare
    display_name: Cloudflare (Workers AI)
    hosting: cloud
    credential_env_keys: [CLOUDFLARE_API_TOKEN]
    requires_account_id: true
