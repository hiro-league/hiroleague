# Hiro LLM catalog — curated reference data.
# Model *names* follow vendor APIs as of 2026-11-06 (see developers.openai.com/api/docs/models,
# aistudio.google.com/docs/models, platform.claude.com/docs/.../models/overview).
# Policy: keep only the current lineup per provider/kind — drop models a newer, comparable,
# reasonably priced model replaces (no history rows). Embedding models are the exception: a swap
# means re-embedding the vector store, so they change only deliberately.
# Pricing is approximate; pricing_source points to vendor API pricing pages (verify before billing).
# released_at: vendor model/API launch date (ISO YYYY-MM-DD); used for admin sort — verify release notes.
# tts_voices: preset ids for bundled TTS integrations — verify against vendor docs when upgrading SDKs.
# catalog_version: PEP 440-style string (quote so YAML does not parse as float).
# Kept in lockstep with the workspace package version (same release axis) — bump together.
# hidden: provider is excluded from all listing surfaces (admin/CLI/pickers/scan-env/add flows)
# but still resolves for existing configurations — see Provider.hidden in model_catalog.py.
catalog_version: "0.2.0"

