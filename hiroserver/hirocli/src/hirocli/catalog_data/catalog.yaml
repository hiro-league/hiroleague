models:
  # --- OpenAI cloud (developers.openai.com/api/docs/models; checked 2026-11-06) ---
  # Current lineup only: GPT-6 replaced GPT-5.x at lower prices (gpt-5 / -mini / -nano / -pro shut down
  # Dec 11, 2026). Common to these rows: 1.05M context (922K max input), 128K max output; prompts over
  # 272K input tokens bill 2x input and 1.5x output for the whole request. No GPT-6 model accepts
  # `minimal` effort or a custom temperature; tool calling needs the Responses API, which the factory
  # always uses for reasoning models. Separate *-pro ids are gone: `reasoning.mode: "pro"` replaces them.
  - id: openai:gpt-6-astra
    provider_id: openai
    display_name: GPT-6 Astra
    released_at: "2026-09-03"
    model_kind: chat
    model_class: reasoning
    context_window: 1050000
    modalities: [text, image_in]
    features: [tools, structured_output, parallel_tools, streaming, json_mode, reasoning]
    # Flagship: no `none` effort (use low); never accepts temperature / top_p / logprobs.
    reasoning_efforts: [low, medium, high, xhigh, max]
    notes: OpenAI flagship. Tool calling only through the Responses API. Effort low–max (default medium).
    pricing:
      input_per_1m_tokens: 10.00
      cached_input_per_1m_tokens: 1.00
      output_per_1m_tokens: 50.00
      pricing_updated_at: "2026-11-06"
      pricing_source: https://developers.openai.com/api/docs/models/gpt-6-astra

