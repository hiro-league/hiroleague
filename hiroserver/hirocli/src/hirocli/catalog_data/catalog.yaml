    provider_id: openai
    display_name: GPT-5.5
    released_at: "2026-04-23"
    model_kind: chat
    model_class: reasoning
    context_window: 1050000
    modalities: [text, image_in]
    features: [tools, structured_output, parallel_tools, streaming, json_mode, reasoning]
    reasoning_efforts: [none, low, medium, high, xhigh]
    notes: Frontier model; prompts with >272K input tokens use 2x input and 1.5x output for the full session (see OpenAI pricing).
    pricing:
      input_per_1m_tokens: 5.00
