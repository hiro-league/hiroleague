[tool.uv.workspace]
members = ["hiroleague", "hirocli", "gateway", "hiro-channel-sdk", "hiro-commons", "hiro-memory", "hiro-extension-kit", "channels/*"]

# PyTorch's processor-only builds, for torch alone on Linux (hirocli's [tool.uv.sources]); explicit: nothing else is
# taken from it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["debugpy>=1.8,<2", "pytest-xdist>=3.8.0", "ruff>=0.17.6"]

# Lint: `uv run ruff check` from hiroserver (a part of scripts/check.sh). The rules are the ones every Hiro League repo
# follows, in one shared file.
[tool.ruff]
extend = "../build-kit/ruff-rules.toml"

# Workspace-level runs collect several test files with the same basename.
# Importlib mode gives each file a unique import path during collection.
#
# consider_namespace_packages: the `hirocli` member DIRECTORY has the same name
# as the importable `hirocli` package (unique among members — the others differ,
# e.g. gateway/->hirogate). Without this, a workspace-root collection resolves
# `hirocli` to the member dir as an implicit namespace package (whose code lives
# under src/, so hirocli.domain/.services/... aren't found) and every hirocli
# test errors on collection. This flag makes pytest resolve to the real editable
# package instead. See docs/build/local-build/packaging-releases.
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true
